name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build image
      run: docker build -t claudio_saavedra-api-micro-flask:latest .

    - name: Run tests
      run: |
        docker run --rm claudio_saavedra-api-micro-flask:latest pytest tests/

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push image
      run: docker push claudio_saavedra-api-micro-flask:latest

    - name: Deploy to Swarm
      run: |
        docker stack deploy -c docker-compose.yml microstack
